version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing depedencies...
      - npm install
  build:
    on-failure: ABORT
    commands:
      - echo Building application...
      - npm run build
  post_build:
    commands:
      - echo Build completed. Copying files to S3...
      - aws s3 cp dist s3://portfolio-dnc --recursive

artifacts:
  files:
    - '**/*'
  base-directory: dist
  
cache:
  paths:
    - 'node_modules/**/*'
